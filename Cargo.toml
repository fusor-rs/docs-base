[workspace]
members = ["crates/docs-base", "crates/docs-base-build", "examples/book"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fusor-rs/docs-base"
publish = false

[workspace.dependencies]
fusor = { package = "fusor-core", version = "=0.1.4", features = ["dom", "derive"] }
fusor-components = { version = "=0.1.4", features = ["browser"] }
fusor-build = "=0.1.4"
fusor-router = { version = "=0.1.4", features = ["browser"] }
wasm-bindgen = "=0.2.117"
web-sys = { version = "=0.3.94", features = ["KeyboardEvent", "Storage", "HtmlElement", "console"] }
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-themes", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
quote = "=1.0.47"
proc-macro2 = "=1.0.107"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0
