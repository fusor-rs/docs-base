[package]
name = "docs-base-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docs-base = { path = "../../crates/docs-base" }
fusor.workspace = true
fusor-components.workspace = true
fusor-router.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
docs-base-build = { path = "../../crates/docs-base-build" }
fusor-build.workspace = true

[package.metadata.fusor]
entry = "web/index.html"
assets = "public"
base-path = "/manual/"
history-fallback = ["/"]

[lints]
workspace = true
